name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    name: Build AnimeKx Debug APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # PNPM
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # CHECK PROJECT
      # ==========================================
      - name: Check Expo project
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "CHECK EXPO PROJECT"
          echo "================================"

          if [ ! -f package.json ]; then
            echo "::error::package.json tidak ditemukan."
            exit 1
          fi

          echo "✓ package.json ditemukan"

          if [ -f pnpm-lock.yaml ]; then
            echo "✓ pnpm-lock.yaml ditemukan"
          else
            echo "⚠ pnpm-lock.yaml tidak ditemukan"
            echo "Menggunakan pnpm install biasa."
          fi

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      # ==========================================
      # EXPO PREBUILD
      # ==========================================
      - name: Expo prebuild
        shell: bash
        run: |
          set -euo pipefail

          npx expo prebuild \
            --platform android \
            --clean
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co

      # ==========================================
      # VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "CHECK ANDROID PROJECT"
          echo "================================"

          if [ ! -d android ]; then
            echo "::error::Folder android/ tidak dibuat oleh Expo prebuild."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew tidak ditemukan."
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle Wrapper tidak ditemukan."
            exit 1
          fi

          if [ ! -d android/app ]; then
            echo "::error::android/app tidak ditemukan."
            exit 1
          fi

          echo "✓ android/"
          echo "✓ android/gradlew"
          echo "✓ Gradle Wrapper"
          echo "✓ android/app"

      # ==========================================
      # GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # ==========================================
      # CLEAN BUILD
      # ==========================================
      - name: Clean Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon

      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            -PnewArchEnabled=false \
            --no-daemon \
            --stacktrace \
            --rerun-tasks
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co

      # ==========================================
      # CHECK APK EXISTS
      # ==========================================
      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::app-debug.apk tidak ditemukan."

            echo ""
            echo "APK yang tersedia:"
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "================================"
          echo "APK DITEMUKAN"
          echo "================================"

          ls -lh "$APK"

      # ==========================================
      # VALIDATE APK ZIP
      # ==========================================
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "================================"
          echo "VALIDATE APK"
          echo "================================"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$APK"

          echo ""
          echo "================================"
          echo "SHA256"
          echo "================================"

          sha256sum "$APK"

          echo ""
          echo "================================"
          echo "APK VALID"
          echo "================================"

      # ==========================================
      # RENAME
      # ==========================================
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            AnimeKx-debug.apk

          ls -lh AnimeKx-debug.apk

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeKx-debug
          path: AnimeKx-debug.apk
          if-no-files-found: error
          retention-days: 7
